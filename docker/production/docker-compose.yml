services:
  backend:
    container_name: work-tracker-api
    image: work-tracker-api:latest
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "5"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: work-tracker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "5"
    volumes:
      - redis_data:/data

volumes:
  redis_data: