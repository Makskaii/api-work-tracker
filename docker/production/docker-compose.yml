services:
  backend:
    container_name: work-tracker-api
    image: work-tracker-api:latest
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"